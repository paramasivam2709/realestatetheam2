<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(rgba(9,37,25,.92),rgba(9,37,25,.92)),
    url('images/slider/2.webp') center/cover no-repeat;
    font-family:Arial,sans-serif;
}

.login-card{
    width:100%;
    max-width:450px;
    background:#0f2e22;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:180px;
}

.logo h3{
    color:#fff;
    margin-top:15px;
}

.logo p{
    color:#b9d4c7;
}

.form-control{
    height:52px;
    background:#163a2c;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
}

.form-control:focus{
    background:#163a2c;
    color:#fff;
    border-color:#39d98a;
    box-shadow:none;
}

.form-control::placeholder{
    color:rgba(255,255,255,.5);
}

label{
    color:#fff;
    margin-bottom:8px;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.links a{
    color:#8fd6b0;
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    color:#39d98a;
}

.btn-login{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:#39d98a;
    color:#092519;
    font-weight:bold;
    font-size:16px;
    transition:.3s;
}

.btn-login:hover{
    background:#56e39c;
}

.signup-text{
    text-align:center;
    margin-top:20px;
    color:#b9d4c7;
}

.signup-text a{
    color:#39d98a;
    text-decoration:none;
}

@media(max-width:576px){

    body{
        padding:20px;
    }

    .login-card{
        padding:25px;
    }

    .logo img{
        width:150px;
    }
}
.back-btn{
    display:block;
    width:max-content;
    color:#8fd6b0;
    text-decoration:none;
    margin:20px auto 0;
    font-size:15px;
    transition:.3s;
    text-align:center;
}

.back-btn:hover{
    color:#39d98a;
    transform:translateX(-3px);
}
</style>
</head>
<body>
    <body>


<div class="login-card">

<div class="login-card">

    <div class="logo">
       <a href="index.html">
            <img src="images/logo.webp" alt="Stackly Logo">
        </a>
        <h3>Welcome Back</h3>
        <p>Login to access your dashboard</p>
    </div>

    <form id="loginForm">

        <div class="mb-3">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required>
        </div>

        <div class="links">
            <a href="forgot.html">Forgot Password?</a>
            <a href="register.html">Create Account</a>
        </div>

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

    <div class="signup-text">
        Don't have an account?
        <a href="register.html">Sign Up</a>
    </div>
    <a href="index.html" class="back-btn">
    ← Back to Home
</a>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("email").value;

    localStorage.setItem("loggedInUser", email);

    window.location.href = "404.html";

});
</script>

</body>
</html>
