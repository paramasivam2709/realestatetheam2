<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(rgba(9,37,25,.92),rgba(9,37,25,.92)),
    url('images/slider/2.webp') center/cover no-repeat;
    font-family:Arial,sans-serif;
    padding:20px;
}

.signup-card{
    width:100%;
    max-width:500px;
    background:#0f2e22;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    color:#8fd6b0;
    text-decoration:none;
}

.back-btn:hover{
    color:#39d98a;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:180px;
}

.logo h3{
    color:#fff;
    margin-top:15px;
}

.logo p{
    color:#b9d4c7;
}

.form-control{
    height:52px;
    background:#163a2c;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
}

.form-control:focus{
    background:#163a2c;
    color:#fff;
    border-color:#39d98a;
    box-shadow:none;
}

.form-control::placeholder{
    color:rgba(255,255,255,.5);
}

label{
    color:#fff;
    margin-bottom:8px;
}

.btn-signup{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:#39d98a;
    color:#092519;
    font-weight:bold;
    font-size:16px;
    margin-top:10px;
}

.btn-signup:hover{
    background:#56e39c;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#b9d4c7;
}

.login-link a{
    color:#39d98a;
    text-decoration:none;
}

@media(max-width:576px){
    .signup-card{
        padding:25px;
    }

    .logo img{
        width:150px;
    }
}
</style>
</head>
<body>

<div class="signup-card">


    <div class="logo">
        <img src="images/logo.webp" alt="Stackly Logo">
        <h3>Create Account</h3>
        <p>Join Stackly today</p>
    </div>

    <form id="signupForm">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text"
                   class="form-control"
                   id="name"
                   placeholder="Enter full name"
                   required>
        </div>

        <div class="mb-3">
            <label>Email Address</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   placeholder="Enter email"
                   required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   placeholder="Create password"
                   required>
        </div>

        <div class="mb-3">
            <label>Confirm Password</label>
            <input type="password"
                   class="form-control"
                   id="confirmPassword"
                   placeholder="Confirm password"
                   required>
        </div>

        <button type="submit" class="btn-signup">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>
document.getElementById("signupForm").addEventListener("submit", function(e){

    e.preventDefault();

    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){
        alert("Passwords do not match!");
        return;
    }

    document.querySelector(".signup-card").innerHTML = `
        <div style="text-align:center;padding:40px;">
            <h2 style="color:#39d98a;">✓ Account Created Successfully</h2>
            <p style="color:#fff;">Redirecting to Login Page...</p>
        </div>
    `;

    setTimeout(function(){
        window.location.href = "login.html";
    }, 3000);

});
</script>


</body>
</html>
