<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Stackly</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(rgba(9,37,25,.92),rgba(9,37,25,.92)),
    url('images/slider/2.webp') center/cover no-repeat;
    font-family:Arial,sans-serif;
    padding:20px;
}

.forgot-card{
    width:100%;
    max-width:450px;
    background:#0f2e22;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:170px;
}

.logo h3{
    color:#fff;
    margin-top:15px;
}

.logo p{
    color:#b9d4c7;
}

.form-control{
    height:52px;
    background:#163a2c;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
}

.form-control:focus{
    background:#163a2c;
    color:#fff;
    border-color:#39d98a;
    box-shadow:none;
}

.form-control::placeholder{
    color:rgba(255,255,255,.5);
}

label{
    color:#fff;
    margin-bottom:8px;
}

.btn-reset{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:#39d98a;
    color:#092519;
    font-weight:bold;
    margin-top:10px;
}

.btn-reset:hover{
    background:#56e39c;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    color:#8fd6b0;
    text-decoration:none;
}

.back-btn:hover{
    color:#39d98a;
}

@media(max-width:576px){
    .forgot-card{
        padding:25px;
    }

    .logo img{
        width:140px;
    }
}
</style>
</head>
<body>

<div class="forgot-card">

    

    <div class="logo">
        <img src="images/logo.webp" alt="Stackly Logo">
        <h3>Forgot Password</h3>
        <p>Enter your email to reset your password</p>
    </div>

    <form id="forgotForm">

        <div class="mb-3">
            <label>Email Address</label>
            <input
                type="email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <button type="submit" class="btn-reset">
            Send Reset Link
        </button>

    </form>

</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(e){

    e.preventDefault();

    document.querySelector(".forgot-card").innerHTML = `
        <div style="text-align:center;padding:30px;">
            <h2 style="color:#39d98a;">✓ Reset Link Sent</h2>
            <p style="color:#fff;margin-top:10px;">
                Password reset instructions have been sent to your email.
            </p>
            <p style="color:#b9d4c7;">
                Redirecting to Login Page...
            </p>
        </div>
    `;

    setTimeout(function(){
        window.location.href = "login.html";
    }, 3000);

});
</script>

</body>
</html>
